name: Publicar el Lab

# Cada vez que alguien sube o cambia algo dentro de sandbox/, se publica el sitio
# completo en lab.charlysway.com. Nadie tiene que usar la terminal ni tener
# credenciales de Cloudflare en su ordenador.

on:
  push:
    branches: [master]
    paths:
      - 'sandbox/**'
      - '.github/workflows/publicar-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

# Si se suben dos piezas seguidas, se publican en orden en vez de pisarse.
concurrency:
  group: publicar-lab
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que no se cuelan credenciales
        run: |
          if grep -rInE 'cfat_[A-Za-z0-9]{20}|sk_live_[A-Za-z0-9]{10}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|CLOUDFLARE_API_TOKEN\s*=' sandbox/; then
            echo "::error::Hay algo con pinta de credencial dentro de sandbox/. No se publica."
            exit 1
          fi
          echo "Sin credenciales a la vista."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Desplegar a Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy sandbox --project-name=cw-lab --branch=main --commit-dirty=true

      - name: Comprobar que el Lab responde
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://lab.charlysway.com/)
          echo "lab.charlysway.com responde $code"
          [ "$code" = "200" ] || { echo "::error::El Lab no responde 200 tras publicar."; exit 1; }
